name: Build Moto G45 Stock Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-21
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole llvm lld python3

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 tools/clang

      - name: Integrate KernelSU & SUSFS
        run: |
          # Setup KernelSU
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          
          # Setup SUSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          
          # Patch KernelSU for SUSFS
          if [ -d "KernelSU" ]; then
            cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          fi
          
          # Patch Kernel for SUSFS
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure and Fix Moto DT
        run: |
          export ARCH=arm64
          mkdir -p out
          
          # Search for the base config and the moto fragment
          # This avoids the "cat: ''" error by checking if files exist first
          BASE_CONF=$(find arch/arm64/configs/ -name "*defconfig" | grep -E "holi|qgki" | head -n 1)
          FOGOS_FRAG=$(find arch/arm64/configs/ -name "*fogo*" | head -n 1)

          if [ -z "$BASE_CONF" ]; then
            echo "Error: Could not find a base defconfig!"
            exit 1
          fi

          # Start building the combined config
          cp "$BASE_CONF" arch/arm64/configs/stock_defconfig
          
          if [ -n "$FOGOS_FRAG" ]; then
            echo "Merging fragment: $FOGOS_FRAG"
            cat "$FOGOS_FRAG" >> arch/arm64/configs/stock_defconfig
          fi

          # Apply the config
          make O=out ARCH=arm64 stock_defconfig
          
          # Force set required flags to avoid interactive prompts
          ./scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY
          ./scripts/config --file out/.config -e CONFIG_LTO_NONE
          ./scripts/config --file out/.config -d CONFIG_LTO_CLANG
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          
          # Wi-Fi sublevel fix for Stock ROM
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          
          # Sync the config
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            LD=ld.lld \
            Image dtbs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-G45-Fogos
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dts/vendor/qcom/*.dtbo
