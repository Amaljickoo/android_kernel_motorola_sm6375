name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev \
        gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4 patch

    # 🔥 KernelSU (stable manual)
    - name: Integrate KernelSU
      run: |
        set -e
        git clone https://github.com/tiann/KernelSU.git --depth=1 KernelSU_source
        mkdir -p drivers/kernelsu
        cp -r KernelSU_source/kernel/* drivers/kernelsu/
        grep -q 'kernelsu' drivers/Makefile || echo 'obj-$(CONFIG_KERNELSU) += kernelsu/' >> drivers/Makefile
        grep -q 'kernelsu' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        rm -rf KernelSU_source

    # 🔥 SUSFS
    - name: Integrate SUSFS
      run: |
        set -e
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src

        cp susfs_src/kernel_patches/fs/susfs.c fs/ || true
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/ || true
        cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/ || true

        patch -p1 -f < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

        if [ -f susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
          (cd drivers/kernelsu && patch -p1 -f < ../../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch) || true
        fi

    # 🔧 CRITICAL FIXES (SAFE ONLY)
    - name: Fix KernelSU + SUSFS
      run: |
        set -e

        # fsnotify fix
        find . -name "*.c" -exec sed -i 's/\.handle_inode_event/.handle_event/g' {} + || true

        # pgtable fix
        find drivers/kernelsu -type f -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} + || true

        # mount fix
        grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
        sed -i '/struct vfsmount {/a \        int susfs_mnt_id_backup;' include/linux/mount.h

        # safe include
        grep -q "susfs_def.h" include/linux/fs.h || \
        sed -i '1i #include <linux/susfs_def.h>' include/linux/fs.h

    # ⚙️ CONFIG (SAFE + WIFI + STABILITY)
    - name: Configure Kernel
      run: |
        set -e
        export ARCH=arm64

        find . -type f \( -name "Makefile" -o -name "Kbuild" \) \
        -exec sed -i 's/-Werror/-Wno-error/g' {} +

        make O=out ARCH=arm64 vendor/fogos_defconfig

        # core features
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT

        # network stability (VERY IMPORTANT)
        ./scripts/config --file out/.config -e CONFIG_WLAN
        ./scripts/config --file out/.config -e CONFIG_CFG80211
        ./scripts/config --file out/.config -e CONFIG_MAC80211
        ./scripts/config --file out/.config -e CONFIG_INET
        ./scripts/config --file out/.config -e CONFIG_IPV6

        # performance safe tweaks
        ./scripts/config --file out/.config -e CONFIG_HZ_300
        ./scripts/config --file out/.config -e CONFIG_SCHED_AUTOGROUP

        # battery safe
        ./scripts/config --file out/.config -e CONFIG_CPU_IDLE
        ./scripts/config --file out/.config -e CONFIG_PM_SLEEP

        # disable risky debug
        ./scripts/config --file out/.config -d CONFIG_WERROR
        ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG

        make O=out ARCH=arm64 olddefconfig

    # 🔥 BUILD (FULL + MODULES)
    - name: Build Kernel
      run: |
        set -e
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make -j$(nproc) O=out ARCH=arm64 \
        CC=aarch64-linux-gnu-gcc \
        KCFLAGS='-w -Wno-error' \
        Image.gz-dtb modules

        make O=out ARCH=arm64 modules_install INSTALL_MOD_PATH=out/modules

    # 📦 PACKAGE (MODULES FLASHABLE)
    - name: Create Flashable Zip
      run: |
        set -e
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1

        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb

        mkdir -p AnyKernel3/modules/system/lib/modules
        cp -r out/modules/lib/modules/* AnyKernel3/modules/system/lib/modules/ || true

        cd AnyKernel3

        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/do.modules=0/do.modules=1/g' anykernel.sh

        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=fogos/g' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=sm6375/g' anykernel.sh

        sed -i 's/kernel.string=.*/kernel.string=Moto G45 ULTIMATE STABLE (KSU+SUSFS)/g' anykernel.sh

        zip -r9 ../Moto-G45-Kernel-ULTIMATE-STABLE.zip . -x "*.git*"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Kernel
        path: Moto-G45-Kernel-ULTIMATE-STABLE.zip
