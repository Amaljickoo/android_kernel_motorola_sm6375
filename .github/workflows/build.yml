name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4 patch

    - name: Integrate KernelSU
      run: |
        set -e
        echo "Integrating KernelSU..."
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main || true

        if [ ! -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
          echo "ERROR: KernelSU integration failed"
          exit 1
        fi

    - name: Integrate SUSFS
      run: |
        set -e
        echo "Integrating SUSFS..."
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src

        cp -f susfs_src/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
        cp -f susfs_src/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true

        if [ -f "susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch" ]; then
          patch -p1 -f --no-backup-if-mismatch < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
        fi

    - name: Fix KernelSU + SUSFS (Safe)
      run: |
        set -e

        # Fix pgtable include
        find KernelSU drivers/kernelsu -type f -name "*.[ch]" \
          -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} + || true

        # Create susfs_def.h only if missing
        if [ ! -f include/linux/susfs_def.h ]; then
          mkdir -p include/linux
          echo "#pragma once" > include/linux/susfs_def.h
        fi

        # Avoid duplicate include injection
        grep -q "susfs_def.h" include/linux/fs.h || \
          echo '#include <linux/susfs_def.h>' >> include/linux/fs.h

        # Safe mount struct patch
        grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
          sed -i '/struct vfsmount {/a \    int susfs_mnt_id_backup;' include/linux/mount.h

        # KernelSU fixes
        find KernelSU drivers/kernelsu -name "pkg_observer.c" \
          -exec sed -i 's/\.handle_inode_event/.handle_event/g' {} + || true

        # SELinux safe fix
        find KernelSU drivers/kernelsu -name "rules.c" \
          -exec sed -i 's/selinux_state\.policy/selinux_state.ss/g' {} + || true

    - name: Configure Kernel
      run: |
        set -e
        export ARCH=arm64

        sed -i 's/-Werror/-Wno-error/g' Makefile || true

        make O=out ARCH=arm64 vendor/fogos_defconfig

        # IMPORTANT: Keep WiFi configs SAFE (no forcing modules wrongly)
        ./scripts/config --file out/.config \
          -e CONFIG_KERNELSU \
          -e CONFIG_KERNELSU_SUSFS \
          -e CONFIG_CFG80211 \
          -e CONFIG_WLAN \
          -e CONFIG_WLAN_VENDOR_QCOM \
          -e CONFIG_CNSS2 \
          -d CONFIG_MODULE_SIG \
          -d CONFIG_WERROR || true

        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        set -e
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make -j$(nproc) O=out \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS="-Wno-error -w" \
          Image.gz-dtb || \
        make -j$(nproc) O=out \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS="-Wno-error -w" \
          Image.gz

    - name: Create AnyKernel3 Zip
      run: |
        set -e

        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1

        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        else
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz-dtb
        fi

        cd AnyKernel3

        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Moto G45 Kernel KSU SUSFS/g' anykernel.sh

        zip -r9 ../Moto-G45-Kernel.zip ./* -x "*.git*"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Kernel
        path: Moto-G45-Kernel.zip
