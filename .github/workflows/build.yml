name: Build Kernel (Moto G45 - FINAL STABLE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu

    - name: Setup Toolchain (Proton Clang)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1

    - name: Add KernelSU
      run: |
        git clone https://github.com/tiann/KernelSU.git KernelSU

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        # ❌ DO NOT TOUCH GLOBAL PATH
        CLANG=$PWD/proton-clang/bin/clang

        # ✅ Step 1: config (uses system tools)
        make O=out ARCH=arm64 vendor/fogos_defconfig

        # ✅ Step 2: build (explicit clang only)
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=$CLANG \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
