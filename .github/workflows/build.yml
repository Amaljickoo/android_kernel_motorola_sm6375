name: Build Moto G45 (fogos) Stock-ROM Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.1 # Stable branch for Moto SM6375
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole llvm lld

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 tools/clang

      - name: Integrate KernelSU & SUSFS
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure for Stock ROM
        run: |
          export ARCH=arm64
          
          # STEP 1: Find the config
          # We look for 'holi-moto_defconfig' first, then 'holi_defconfig'
          CONF_PATH=$(find arch/arm64/configs/vendor/ -name "holi-moto_defconfig" -o -name "holi_defconfig" | head -n 1)
          
          if [ -z "$CONF_PATH" ]; then
            echo "ERROR: Could not find any holi defconfig!"
            exit 1
          fi
          
          echo "Found config at: $CONF_PATH"
          
          # STEP 2: COPY it to the root of configs so 'make' can find it easily
          cp "$CONF_PATH" arch/arm64/configs/stock_defconfig
          
          # STEP 3: Create output directory and configure
          mkdir -p out
          make O=out ARCH=arm64 stock_defconfig
          
          # WIFI FIX: Match Stock Sublevel
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          
          # KSU & SUSFS Setup
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
          
          # STOCK COMPATIBILITY: Disable module signing so stock Wi-Fi works
          ./scripts/config --file out/.config -d CONFIG_MODVERSIONS
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
          
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel (Wait ~60 mins)
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            LD=ld.lld

      - name: Upload Stock-Safe Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-G45-Stock-KSU
          path: out/arch/arm64/boot/Image
