name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4 patch

    - name: Integrate KernelSU
      run: |
        set -e
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

        # Standardizing location to drivers/kernelsu
        if [ -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
          mkdir -p drivers/kernelsu
          cp -r KernelSU/* drivers/kernelsu/
          rm -rf KernelSU
        fi

    - name: Integrate SUSFS
      run: |
        set -e
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src

        # Copy SUSFS headers and source
        cp susfs_src/kernel_patches/fs/susfs.c fs/ || true
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/ || true
        cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/ || true

        # Apply SUSFS kernel patch
        if [ -f susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch ]; then
          patch -p1 -f < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
        fi

        # Apply SUSFS KernelSU-specific patch
        if [ -d "drivers/kernelsu" ] && [ -f susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
          cd drivers/kernelsu
          patch -p1 -f < ../../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ../..
        fi

    - name: Fix KernelSU and SUSFS Compatibility
      run: |
        set -e

        # 1. Create missing linux/pgtable.h if it doesn't exist
        if [ ! -f include/linux/pgtable.h ]; then
          echo '#include <asm/pgtable.h>' > include/linux/pgtable.h
        fi

        # 2. Directly patch sucompat.c to use asm/pgtable.h
        if [ -f drivers/kernelsu/feature/sucompat.c ]; then
          sed -i 's/#include <linux\/pgtable.h>/#include <asm\/pgtable.h>/' drivers/kernelsu/feature/sucompat.c
        fi

        # 3. Fix KernelSU 5.4 API: handle_inode_event -> handle_event
        find drivers/kernelsu -name "pkg_observer.c" -exec sed -i 's/\.handle_inode_event/.handle_event/g' {} + || true

        # 4. Add susfs_mnt_id_backup to struct vfsmount safely
        if ! grep -q "susfs_mnt_id_backup" include/linux/mount.h; then
          sed -i '/struct vfsmount {/a \	int susfs_mnt_id_backup;' include/linux/mount.h
        fi

        # 5. Inject SUSFS definitions into namespace.c only if missing
        grep -q "susfs_def.h" fs/namespace.c || sed -i '1i #include <linux/susfs_def.h>' fs/namespace.c
        
        if ! grep -q "susfs_mnt_id_ida" fs/namespace.c; then
          sed -i '/DEFINE_IDA(mnt_group_ida);/a DEFINE_IDA(susfs_mnt_id_ida);\nDEFINE_IDA(susfs_mnt_group_ida);' fs/namespace.c
        fi

        # 6. Global header awareness for SUSFS structures
        grep -q "susfs_def.h" include/linux/fs.h || sed -i '/#define _LINUX_FS_H/a #include <linux/susfs_def.h>' include/linux/fs.h

    - name: Configure Kernel
      run: |
        set -e
        export ARCH=arm64

        # Disable -Werror in all Makefiles to prevent WiFi drivers from failing on warnings
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b/-Wno-error/g' {} \;

        make O=out ARCH=arm64 vendor/fogos_defconfig

        # Enable KernelSU and SUSFS configs
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT

        # Enable seccomp (required by KernelSU's seccomp_cache.c)
        ./scripts/config --file out/.config -e CONFIG_SECCOMP
        ./scripts/config --file out/.config -e CONFIG_SECCOMP_FILTER

        # Restored Network, WiFi and issue fixes
        ./scripts/config --file out/.config -e CONFIG_WLAN
        ./scripts/config --file out/.config -e CONFIG_WLAN_VENDOR_QCOM
        ./scripts/config --file out/.config -e CONFIG_CFG80211
        ./scripts/config --file out/.config -e CONFIG_CFG80211_WEXT
        ./scripts/config --file out/.config -e CONFIG_MAC80211
        ./scripts/config --file out/.config -e CONFIG_INET
        ./scripts/config --file out/.config -e CONFIG_IPV6
        
        # Cleanup Debugging and Module Signing
        ./scripts/config --file out/.config -d CONFIG_WERROR
        ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL

        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        set -e
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # Use KCFLAGS with single quotes to ensure compiler options are passed correctly
        # -w silences all warnings that might trigger build breaks in SM6375 vendor modules
        make -j$(nproc) O=out ARCH=arm64 \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS='-w -Wno-error -Wno-implicit-function-declaration' \
          Image.gz-dtb || \
        make -j$(nproc) O=out ARCH=arm64 \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS='-w -Wno-error' \
          Image.gz

    - name: Create Flashable Zip
      run: |
        set -e
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1

        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        else
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz-dtb
        fi

        cd AnyKernel3
        # Device Identity Fixes
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=fogos/g' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=sm6375/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Moto G45 Fogos ULTIMATE V5 (KSU+SUSFS)/g' anykernel.sh
        sed -i 's/supported.versions=.*/supported.versions=14-15/g' anykernel.sh

        zip -r9 ../Moto-G45-Kernel-Fogos-ULTIMATE.zip . -x "*.git*"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Kernel-ULTIMATE
        path: Moto-G45-Kernel-Fogos-ULTIMATE.zip
