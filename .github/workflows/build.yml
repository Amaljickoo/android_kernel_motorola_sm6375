name: Build Moto G45 (fogos) Stock-Safe Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.1
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole llvm lld

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 tools/clang

      - name: Integrate KernelSU
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

      - name: Integrate SUSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          
          # 1. LIST ALL CONFIGS (This helps you see what's actually there if it fails)
          echo "Checking available configurations..."
          find arch/arm64/configs/ -name "*defconfig" | head -n 30
          
          # 2. BETTER DISCOVERY: Search for fogos or holi or sm6375
          # It looks for fogos first, then falls back to holi
          CONF_PATH=$(find arch/arm64/configs/ -name "*fogos*" | head -n 1 | sed 's|arch/arm64/configs/||')
          
          if [ -z "$CONF_PATH" ]; then
             echo "Fogos config not found, trying holi/sm6375..."
             CONF_PATH=$(find arch/arm64/configs/ -name "*holi*" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi
          
          if [ -z "$CONF_PATH" ]; then
             echo "ERROR: Could not find any matching defconfig! Check the logs above."
             exit 1
          fi
          
          echo "Selected Config: $CONF_PATH"
          make O=out ARCH=arm64 "$CONF_PATH"
          
          # Match Stock Versioning (Wi-Fi Fix)
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          
          # Enable KSU & SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
          
          # WIFI FIX: Stop stock modules from crashing
          ./scripts/config --file out/.config -d CONFIG_MODVERSIONS
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
          
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          
          # Using 'gcc' for HOSTCC prevents the '.relr.dyn' error you saw earlier
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-G45-fogos-KSU-SUSFS
          path: out/arch/arm64/boot/Image
