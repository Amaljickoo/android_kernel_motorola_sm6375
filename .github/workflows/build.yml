name: Moto G45 KernelSU Conservative Build (5.4.274, Android 15)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3-pip
        pip3 install mkbootimg

    - name: Setup stock cmdline
      run: echo "console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.selinux=permissive skip_initramfs" > stock_cmdline

    - name: WiFi fixes + SUSFS config
      run: |
        echo "CONFIG_QCOM_WCNSS_MEM_PRE_ALLOC=y" >> defconfig
        echo "CONFIG_WLAN=y" >> defconfig
        echo "CONFIG_SUSFS=m" >> defconfig

    - name: Create SUSFS module (LINE 43 ULTRA-SIMPLE)
      run: |
        mkdir -p security/selinux/hooks
        echo '#include <linux/module.h>
static int init(void) { printk("SUSFS4KSU: Moto G45\n"); return 0; }
module_init(init); MODULE_LICENSE("GPL");' > security/selinux/hooks/susfs.c
        echo "obj-\$(CONFIG_SUSFS) += hooks/susfs.o" >> security/selinux/Makefile
        echo "config SUSFS
tristate 'SUSFS'
default m" >> security/selinux/Kconfig

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out defconfig
        make O=out olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) O=out CC=aarch64-linux-gnu-gcc Image.gz-dtb

    - name: Create test ramdisk
      run: |
        mkdir tmp_ram
        echo "# test" > tmp_ram/init
        cd tmp_ram && find . | cpio -H newc -o | gzip > ../ramdisk.gz
        cd .. && rm -rf tmp_ram

    - name: Build boot.img
      run: |
        CMDLINE=$(cat stock_cmdline)
        mkbootimg --kernel out/arch/arm64/boot/Image.gz-dtb --ramdisk ramdisk.gz --cmdline "$CMDLINE" --base 0x00000000 --pagesize 4096 --kernel_offset 0x00008000 --ramdisk_offset 0x01800000 --tags_offset 0x00000100 --output boot-MotoG45-FINAL.img

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MotoG45-Conservative
        path: boot-MotoG45-FINAL.img
