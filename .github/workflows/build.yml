name: Moto G45 Fogos-ULTIMATE-V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 zip

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel

    - name: Integrate KernelSU
      run: |
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

    - name: Integrate SUSFS (SAFE)
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
        cp susfs_src/kernel_patches/fs/susfs.c fs/
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/

        if [ -d "KernelSU" ]; then
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ..
        fi

    - name: Fix KernelSU Compatibility
      run: |
        FILE="drivers/kernelsu/feature/sucompat.c"

        if [ -f "$FILE" ]; then
          echo "Fixing KernelSU issues..."

          # Fix pgtable include
          sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' $FILE

          # Fix strncpy issue
          sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' $FILE
        fi

    - name: Configure Kernel
      run: |
        export ARCH=arm64

        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
        sed -i 's/echo "+"/#echo "+"/' scripts/setlocalversion
        echo "-moto-00517-g2ad8f9e38ea6" > localversion

        make O=out ARCH=arm64 vendor/fogos_defconfig

        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT

        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
        ./scripts/config --file out/.config -d CONFIG_WERROR

        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS="-Wno-error"

    - name: Create AnyKernel Zip
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/

        cd AnyKernel
        zip -r9 Moto-G45-Kernel.zip *
        mv Moto-G45-Kernel.zip ../

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Ultimate-Kernel
        path: Moto-G45-Kernel.zip
