name: Moto G45 KernelSU + SUSFS4KSU 5.4.274 (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel (FIXED branch)
        uses: actions/checkout@v4
        with:
          repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
          ref: sixteen  # Correct Android 15 branch for G45

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

      - name: Proton Clang 16
        run: |
          wget https://github.com/kdrag0n/proton-clang/releases/download/16.0.6/proton-clang-16.0.6.tar.gz
          tar xf proton-clang-16.0.6.tar.gz

      - name: Kernel 5.4.274 + WiFi
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch stable linux-5.4.y
          git cherry-pick $(git log stable/linux-5.4.y --grep="5.4.274" --oneline | head -1 | cut -d' ' -f1) || true

      - name: KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' .config || echo "CONFIG_KSU=y" >> .config

      - name: SUSFS4KSU latest
        run: |
          git clone https://github.com/1q23/SUSFS4KSU susfs4ksu --depth=1
          cp susfs4ksu/susfs.c security/selinux/
          cp susfs4ksu/Makefile security/selinux/Makefile.susfs4ksu
          
          echo "obj-\$(CONFIG_SUSFS4KSU) += susfs.o" >> security/selinux/Makefile
          echo "
          config SUSFS4KSU
          bool 'SUSFS4KSU for KernelSU'
          depends on KERNELSU
          default y
          " >> security/selinux/Kconfig
          
          echo "CONFIG_SUSFS4KSU=y" >> .config

      - name: Fogos defconfig + WiFi fixes
        run: |
          export ARCH=arm64
          make O=out fogos_defconfig CC=./proton-clang/bin/clang CLANG_TRIPLE=aarch64-linux-gnu-
          scripts/config --file out/.config -e QCOM_WCNSS_MEM_PRE_ALLOC -e WLAN

      - name: Build
        run: |
          export ARCH=arm64
          export CC=./proton-clang/bin/clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE LLVM=1 Image.gz-dtb

      - name: G45 boot.img
        run: |
          mkdir -p ramdisk/init
          echo "ro.secure=0 ro.ksu=1 androidboot.hardware=qcom androidboot.usbcontroller=a600000.dwc3 androidboot.wificountrycode=IN androidboot.selinux=permissive skip_initramfs" > ramdisk/cmdline
          
          echo "# G45 SUSFS4KSU" > ramdisk/init.rc
          find ramdisk | cpio -H newc -o | gzip > ramdisk.gz

          ./proton-clang/bin/mkbootimg --kernel out/arch/arm64/boot/Image.gz-dtb --ramdisk ramdisk.gz --cmdline "$(cat ramdisk/cmdline)" --base 0x00000000 --pagesize 4096 --kernel_offset 0x00008000 --ramdisk_offset 0x01800000 --tags_offset 0x00000100 --output boot-KernelSU-SUSFS4KSU.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MotoG45-5.4.274-KernelSU-SUSFS4KSU-FIXED
          path: boot-KernelSU-SUSFS4KSU.img
