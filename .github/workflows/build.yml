name: Moto G45 Fogos SUKI-ULTRA (Downloads Stock ROM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Build Tools & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full aria2 bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4

    - name: Download and Extract Stock ROM
      run: |
        set -e
        # This is a direct link to the firmware for your build number.
        # This step will download the large zip and extract ONLY boot.img from it.
        FIRMWARE_URL="https://mirrors.lolinet.com/firmware/motorola/fogos/official/RETIN/XT2363-8_FOGOS_RETIN_15_V1UGS35H.75-14-9-1_subsidy-DEFAULT_regulatory-DEFAULT_cid50_CFC.zip"
        echo "Downloading stock firmware..."
        aria2c -x5 -s5 -j5 -k 1M "$FIRMWARE_URL" -o stock.zip
        echo "Extracting boot.img from firmware..."
        # Use 7z to extract only the boot.img file to save space and time
        7z e stock.zip boot.img -o.
        if [ ! -f "boot.img" ]; then
          echo "ERROR: boot.img not found in the downloaded firmware!"
          exit 1
        fi
        echo "Stock boot.img extracted successfully."

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        # We need the full history for patch compatibility
        fetch-depth: 0

    # The rest of the workflow remains the same, but now it has boot.img available
    - name: Integrate SukiSU Ultra
      run: |
        set -e
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash
        if [ -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
          mv KernelSU drivers/kernelsu
        fi

    - name: Integrate SUSFS & Apply Patches
      run: |
        set -e
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
        cp susfs_src/kernel_patches/fs/susfs.c fs/
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
        cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/
        patch -p1 -f < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

    - name: Force SUSFS Compatibility and Fixes
      run: |
        set -e
        sed -i '/config KERNELSU_SUSFS\n/!b;n;c\	def_bool y' drivers/kernelsu/Kconfig
        sed -i '/config KERNELSU_SUSFS_HAS_MAGIC_MOUNT\n/!b;n;c\	def_bool y' drivers/kernelsu/Kconfig
        ALLOWLIST_PATH=$(find drivers/kernelsu -type f -name "allowlist.h")
        if [ -n "$ALLOWLIST_PATH" ]; then sed -i '1i #include "uapi/app_profile.h"' "$ALLOWLIST_PATH"; fi

    - name: CRITICAL FIXES for Kernel 5.4
      run: |
        set -e
        find drivers/kernelsu -name "*.c" -exec sed -i 's/\.handle_inode_event/.handle_event/g' {} + || true
        rm -f drivers/kernelsu/infra/seccomp_cache.c 2>/dev/null || true
        find drivers/kernelsu -type f -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} + || true
        sed -i '/susfs_def.h/d' include/linux/fs.h
        sed -i '1i #ifdef CONFIG_KERNELSU_SUSFS\n#include <linux/susfs_def.h>\n#endif' include/linux/fs.h
        grep -q "susfs_mnt_id_ida" fs/namespace.c || \
        sed -i '/DEFINE_IDA(mnt_group_ida);/a DEFINE_IDA(susfs_mnt_id_ida);\nDEFINE_IDA(susfs_mnt_group_ida);' fs/namespace.c
        grep -q "susfs_mnt_id_backup" include/linux/mount.h || \
        sed -i '/struct vfsmount {/a \        int susfs_mnt_id_backup;' include/linux/mount.h

    - name: Configure Kernel
      run: |
        set -e
        export ARCH=arm64
        find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i 's/-Werror/-Wno-error/g' {} +
        make O=out ARCH=arm64 vendor/fogos_defconfig
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -d CONFIG_KERNELSU_SECCOMP_CACHE || true
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        set -e
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS='-w -Wno-error' Image.gz-dtb

    - name: Pack Flashable Zip
      run: |
        set -e
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        # Here we could also use the extracted boot.img if needed, but the compiled one is the goal
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Moto G45 Fogos SUKI-ULTRA by @Meta AI/g' anykernel.sh
        zip -r9 ../Moto-G45-Kernel-SUKI-ULTRA.zip . -x "*.git*"
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Kernel-SUKI-ULTRA
        path: Moto-G45-Kernel-SUKI-ULTRA.zip
