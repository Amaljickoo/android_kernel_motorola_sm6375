name: Build Moto G45 KernelSU NON-GKI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y \
          bc bison build-essential flex git libncurses5-dev \
          libssl-dev libelf-dev python3 gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu pahole wget device-tree-compiler

      - name: Download Proton Clang
        run: |
          mkdir -p tools/clang
          cd tools/clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.6/clang-17.0.6.tar.xz
          tar -xf clang-17.0.6.tar.xz
          cd ../..

      - name: KernelSU
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      - name: SUSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 susfs --depth=1
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          cd KernelSU && patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd .. && patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure
        run: |
          export ARCH=arm64
          mkdir out
          
          # Moto G45 config
          cp arch/arm64/configs/vendor/holi_defconfig arch/arm64/configs/stock_defconfig
          
          make O=out stock_defconfig
          
          # Fixes
          scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY
          scripts/config --file out/.config -e CONFIG_LTO_NONE
          scripts/config --file out/.config -e CONFIG_KERNELSU
          
          # Stock ROM
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
          scripts/config --file out/.config -d CONFIG_MODVERSIONS
          scripts/config --file out/.config -d CONFIG_MODULE_SIG
          
          make O=out olddefconfig

      - name: Build
        run: |
          export ARCH=arm64
          CLANG=tools/clang/bin
          
          make -j$(nproc) O=out \
            CC=$CLANG/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=clang \
            LD=$CLANG/ld.lld \
            Image.gz-dtb

      - name: Package
        run: |
          mkdir kernel
          cp out/arch/arm64/boot/Image.gz-dtb kernel/
          cp -r out/arch/arm64/boot/dts/vendor/qcom/*.dtb kernel/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-KernelSU
          path: kernel/
