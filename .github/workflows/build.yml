name: Build Kernel (Detect Defconfig)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu

    - name: Setup Toolchain (Proton Clang)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1

    - name: Add KernelSU
      run: |
        git clone https://github.com/tiann/KernelSU.git KernelSU

    - name: Show Available Defconfigs
      run: |
        ls arch/arm64/configs/

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        export CLANG_PATH=$PWD/proton-clang/bin

        # ❗ CHANGE THIS AFTER CHECKING ABOVE STEP
        DEFCONFIG=vendor_defconfig

        make O=out ARCH=arm64 $DEFCONFIG

        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=$CLANG_PATH/clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
