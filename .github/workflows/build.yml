name: Build Moto G45 Stock Kernel (NON-GKI) - FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg kmod libncurses5-dev \
            libssl-dev libelf-dev python3 python3-pip rsync unzip zip aria2 device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole xmlstarlet wget

      - name: Setup Proton Clang (BULLETPROOF)
        run: |
          # DIRECT DOWNLOAD - NO GIT BRANCH ISSUES
          cd tools
          wget https://github.com/kdrag0n/proton-clang/releases/download/clang-r5067389/proton-clang.tar.gz
          tar -xzf proton-clang.tar.gz
          mv proton-clang clang
          cd ..
          
          # Verify clang works
          tools/clang/bin/clang --version
          tools/clang/bin/ld.lld --version
          echo "✅ Clang setup complete!"

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "✅ KernelSU installed"

      - name: Add SUSFS Support
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp -f susfs_src/kernel_patches/fs/susfs.c fs/
          cp -f susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cd KernelSU && patch -p1 < ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || echo "SUSFS already applied"
          echo "✅ SUSFS ready"

      - name: Configure NON-GKI Kernel
        run: |
          export ARCH=arm64
          mkdir -p out
          
          # Moto G45 NON-GKI config
          DEFCONFIG=$(find arch/arm64/configs/ -name "*holi*" -name "*defconfig" | head -n1)
          echo "Using NON-GKI config: $DEFCONFIG"
          cp "$DEFCONFIG" arch/arm64/configs/stock_defconfig
          
          make O=out ARCH=arm64 stock_defconfig
          
          # Fix Moto DT + NON-GKI
          scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY
          scripts/config --file out/.config -e CONFIG_LTO_NONE
          scripts/config --file out/.config -d CONFIG_LTO_CLANG
          
          # KernelSU + SUSFS
          scripts/config --file out/.config -e CONFIG_KERNELSU
          scripts/config --file out/.config -e CONFIG_OVERLAY_FS
          
          # STOCK compatibility
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          scripts/config --file out/.config -d CONFIG_MODVERSIONS
          scripts/config --file out/.config -d CONFIG_MODULE_SIG
          
          make O=out ARCH=arm64 olddefconfig
          echo "✅ Config ready - SUBLEVEL=274"

      - name: Build Kernel
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=$CLANG_BIN/clang \
            HOSTLD=$CLANG_BIN/ld.lld \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            Image.gz-dtb dtbs
          
          echo "✅ BUILD COMPLETE!"

      - name: Package & Verify
        run: |
          mkdir -p kernel_package
          cp out/arch/arm64/boot/Image.gz-dtb kernel_package/
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} kernel_package/ \;
          ls -lh kernel_package/
          file kernel_package/Image.gz-dtb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-KernelSU-v5.4.274-NON-GKI
          path: |
            kernel_package/
            out/arch/arm64/boot/Image.gz-dtb
          retention-days: 30
