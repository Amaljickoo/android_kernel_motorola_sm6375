name: Moto G45 KernelSU - PERFECT BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libncurses5-dev libssl-dev \
            libelf-dev python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole \
            clang lld llvm device-tree-compiler

      - name: KernelSU Only (No SUSFS)
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      - name: Configure Moto G45
        run: |
          export ARCH=arm64
          mkdir out
          
          # Moto G45 holi config
          DEFCONFIG=$(find arch/arm64/configs -name "*holi*" -name "*defconfig" | head -1)
          echo "Using: $DEFCONFIG"
          cp "$DEFCONFIG" arch/arm64/configs/stock_defconfig
          
          make O=out ARCH=arm64 stock_defconfig
          
          # Essential fixes
          scripts/config --file out
