name: Build Kernel (SukiSU Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Toolchain (Proton Clang)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1

    - name: Add SukiSU Ultra
      run: |
        git clone https://github.com/tiann/KernelSU.git KernelSU
        cd KernelSU
        chmod +x setup.sh
        bash setup.sh
        cd ..

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$PWD/proton-clang/bin:$PATH

        make O=out ARCH=arm64 vendor/gki_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image
