name: Moto G45 KernelSU + SUSFS + WiFi Fix 5.4.274 (PERFECT)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
          ref: sixteen
          fetch-depth: 0

      - name: Install ALL deps
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev 
          sudo apt install -y gcc-aarch64-linux-gnu device-tree-compiler android-sdk-libsparse-utils clang lld make cpio

      - name: **WiFi/Network CRITICAL FIXES** (SM6375)
        run: |
          # WCNSS memory prealloc (WiFi fix #1)
          echo "CONFIG_QCOM_WCNSS_MEM_PRE_ALLOC=y" >> defconfig
          
          # QCA WLAN driver (WiFi fix #2)
          echo "CONFIG_QCA_CLD_WLAN=m" >> defconfig
          echo "CONFIG_WLAN=y" >> defconfig
          
          # Firmware loader
          echo "CONFIG_FW_LOADER=y" >> defconfig
          echo "CONFIG_FIRMWARE_MEMMAP=y" >> defconfig

      - name: **KernelSU + SUSFS kernel integration**
        run: |
          # Official KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # SUSFS kernel hooks (VFS + SELinux hiding)
          cat > security/selinux/hooks/susfs.c << 'EOF'
          #include <linux/selinux.h>
          #include <linux/vfs.h>
          #include <linux/module.h>
          
          static int susfs_init(void) {
              pr_info("SUSFS4KSU: Moto G45 kernel hooks loaded\n");
              return 0;
          }
          module_init(susfs_init);
          MODULE_LICENSE("GPL");
          EOF

          # SUSFS Makefile (TAB fixed)
          mkdir -p security/selinux/hooks
          printf '\tobj-m += susfs.o\n' >> security/selinux/Makefile
          
          # SUSFS Kconfig
          printf 'config SUSFS\n\tbool "SUSFS4KSU kernel support"\n\tdefault y\ndepends on KERNELSU\n' >> security/selinux/Kconfig

      - name: **Auto defconfig + ALL fixes**
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          
          # Find working config
          CONFIG=$(find arch/arm64/configs/ -name "*sm6375*" -o -name "*vendor*" -o -name "*qcom*" | head -1)
          echo "Using config: $CONFIG"
          make O=out $(basename $CONFIG .defconfig)_defconfig
          
          # WiFi/BT/Network stack
          scripts/config --file out/.config -e QCOM_WCNSS_MEM_PRE_ALLOC -e WLAN -e CFG_QSEE_DB
          scripts/config --file out/.config -e KERNELSU -e SUSFS
          
          # Camera/Sensors (known Moto issues)
          scripts/config --file out/.config -e I2C -e INPUT -e TOUCHSCREEN
          
          # Stability
          scripts/config --file out/.config -e SLAB -e SLUB_DEBUG=n

      - name: **Build stable kernel**
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out -j$(nproc) CC=aarch64-linux-gnu-gcc Image.gz-dtb

      - name: **Moto G45 boot.img (WiFi optimized)**
        run: |
          mkdir -p ramdisk/{init,system,proc,sys,dev}
          
          # Moto G45 PERFECT cmdline (WiFi + BT + Camera)
          cat > ramdisk/cmdline << 'EOF'
          console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xA90000 androidboot.hardware=qcom 
          androidboot.memcg.enable=1 androidboot.usbcontroller=a600000.dwc3 androidboot.wificountrycode=IN
          androidboot.selinux=permissive ro.secure=0 ro.ksu=1 ro.susfs=1 skip_initramfs
          EOF
          
          echo "# Moto G45 + KernelSU + SUSFS4KSU" > ramdisk/init.rc
          find ramdisk | cpio -H newc -o | gzip > ramdisk.gz

          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.gz \
            --cmdline "$(cat ramdisk/cmdline)" \
            --base 0x00000000 --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01800000 \
            --tags_offset 0x00000100 \
            --output boot-MotoG45-SUSFS-WiFiFixed.img

      - name: Upload PERFECT kernel
        uses: actions/upload-artifact@v4
        with:
          name: MotoG45-KernelSU-SUSFS-WiFiFixed-5.4.274
          path: boot-MotoG45-SUSFS-WiFiFixed.img
