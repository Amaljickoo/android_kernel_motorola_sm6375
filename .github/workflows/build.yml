name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3

    - name: Integrate KernelSU
      run: |
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

    - name: Integrate SUSFS
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
        cp susfs_src/kernel_patches/fs/susfs.c fs/
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
        
        if [ -d "KernelSU" ]; then
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
        fi
        patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

    - name: Configure and Fix Compile Flags
      run: |
        export ARCH=arm64
        
        # 1. Versioning Fixes
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
        sed -i 's/echo "+"/#echo "+"/' scripts/setlocalversion
        echo "-moto-00517-g2ad8f9e38ea6" > localversion
        
        # 2. SMART FIX: Remove -Werror without breaking the flags
        # This replaces "-Werror" with nothing, but keeps "-Werror=..." intact
        # This fixes the "linker input file not found" error
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror / /g;s/-Werror$//g' {} +
        
        # 3. Load Config
        make O=out ARCH=arm64 vendor/fogos_defconfig

        # 4. Enable KernelSU & SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
        ./scripts/config --file out/.config -e CONFIG_WLAN
        
        # 5. Disable Security/Error Restrictions
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_FORCE
        ./scripts/config --file out/.config -d CONFIG_WERROR
        
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # We use -Wno-error to tell the compiler to ignore all warnings globally
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS="-Wno-error -w" Image.gz-dtb || \
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS="-Wno-error -w" Image.gz

    - name: Create AnyKernel3 Zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        IMAGE=$(find out/arch/arm64/boot/ -name "Image.gz*" | head -n 1)
        cp "$IMAGE" AnyKernel3/Image.gz-dtb
        
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
        sed -i "s/kernel.string=.*/kernel.string=Moto G45 Kernel (bbq-ogki)/g" anykernel.sh
        
        zip -r ../Moto-G45-AnyKernel.zip ./*
        cd ..

    - name: Upload Final Zip
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-AnyKernel-bbq-ogki
        path: Moto-G45-AnyKernel.zip
