name: Build Moto G45 Kernel

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: main  # Use 'fifteen' or 'sixteen' for Lineage 21/22; check repo branches
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make python3 gcc-aarch64-linux-gnu

    - name: Setup toolchain (Clang + GCC)
      run: |
        wget https://github.com/ZyCromerZ/android_prebuilts_clang_host_linux-x86_clang-r498229b/raw/main/clang-r498229b.tar.xz
        tar xf clang-r498229b.tar.xz
        export PATH=$(pwd)/clang-r498229b/bin:$PATH
        aarch64-linux-gnu-gcc --version

    - name: Apply 5.4.274 patch (optional)
      run: |
        # Cherry-pick stable 5.4.274 if base differs
        git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
        git fetch upstream linux-5.4.y
        git cherry-pick <commit-hash-for-5.4.274>  # Replace with actual SHA from kernel.org

    - name: Build kernel
      env:
        CC: clang
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out fogos_defconfig
        make -j$(nproc --all) O=out Image.gz-dtb LLVM=1 LLVM_IAS=1

    - name: Checkout device tree for boot.img params
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_device_motorola_fogos
        path: device/motorola/fogos

    - name: Pack boot.img
      run: |
        # Extract cmdline/base from device tree
        CMDLINE=$(sed -n 's/.*BOARD_KERNEL_CMDLINE := //p' device/motorola/fogos/BoardConfig.mk | tr -d '"')
        PAGE_SIZE=4096
        BASE=0x00000000
        KERNEL_OFFSET=0x00008000
        RAMDISK_OFFSET=0x01000000
        TAGS_OFFSET=0x00000100
        DTB_OFFSET=0x01f00000
        
        # Minimal ramdisk (stock-like)
        mkdir -p ramdisk
        echo "2.0" > ramdisk/default.prop
        mkdir -p ramdisk/init
        echo '#!/system/bin/sh' > ramdisk/init.rc
        gzip -c ramdisk | tee ramdisk.gz
        
        # Build boot.img using libsparse-utils or simple mkbootimg
        android-toolchain/bin/mkbootimg \
          --kernel out/arch/arm64/boot/Image.gz-dtb \
          --ramdisk ramdisk.gz \
          --cmdline "$CMDLINE androidboot.hardware=fogos" \
          --base $BASE \
          --pagesize $PAGE_SIZE \
          --kernel_offset $KERNEL_OFFSET \
          --ramdisk_offset $RAMDISK_OFFSET \
          --tags_offset $TAGS_OFFSET \
          --dtb_offset $DTB_OFFSET \
          --output boot.img

    - name: Create flashable ZIP
      run: |
        mkdir anykernel
        cp boot.img anykernel/
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        # Add AnyKernel3 template (download or clone minimal)
        wget https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/README.md -O anykernel/README.md
        zip -r MotoG45-kernel-$(date +%Y%m%d).zip anykernel/

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      
