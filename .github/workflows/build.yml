name: Moto G45 KernelSU + SUSFS + WiFi 5.4.274 (SYNTAX FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler android-sdk-libsparse-utils make cpio

    - name: WiFi Network fixes
      run: |
        echo "CONFIG_QCOM_WCNSS_MEM_PRE_ALLOC=y" >> defconfig
        echo "CONFIG_WLAN=y" >> defconfig
        echo "CONFIG_CFG80211=y" >> defconfig

    - name: KernelSU integration
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        echo "CONFIG_KSU=y" >> defconfig

    - name: SUSFS kernel support
      run: |
        mkdir -p security/selinux/hooks
        cat > security/selinux/hooks/susfs.c << 'EOF'
#include <linux/module.h>
#include <linux/selinux.h>
static int __init susfs_init(void) {
    pr_info("SUSFS4KSU: Moto G45 loaded\n");
    return 0;
}
module_init(susfs_init);
MODULE_LICENSE("GPL");
EOF
        
        echo "obj-$(CONFIG_SUSFS) += hooks/susfs.o" >> security/selinux/Makefile
        echo "config SUSFS
bool 'SUSFS4KSU kernel support'
default y
depends on KSU" >> security/selinux/Kconfig
        
        echo "CONFIG_SUSFS=y" >> defconfig

    - name: Build defconfig
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out defconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) O=out CC=aarch64-linux-gnu-gcc Image.gz-dtb

    - name: Create boot.img
      run: |
        mkdir -p ramdisk/init
        echo "androidboot.hardware=qcom androidboot.usbcontroller=a600000.dwc3 androidboot.selinux=permissive ro.secure=0 ro.ksu=1 androidboot.wificountrycode=IN skip_initramfs console=ttyMSM0,115200n8" > ramdisk/cmdline
        
        echo "# Moto G45 KernelSU+SUSFS" > ramdisk/init.rc
        find ramdisk | cpio -H newc -o | gzip > ramdisk.gz

        mkbootimg \
          --kernel out/arch/arm64/boot/Image.gz-dtb \
          --ramdisk ramdisk.gz \
          --cmdline "$(cat ramdisk/cmdline)" \
          --base 0x00000000 \
          --pagesize 4096 \
          --kernel_offset 0x00008000 \
          --ramdisk_offset 0x01800000 \
          --tags_offset 0x00000100 \
          --output boot-MotoG45-FINAL.img

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: MotoG45-KernelSU-SUSFS-WiFiFixed
        path: boot-MotoG45-FINAL.img
