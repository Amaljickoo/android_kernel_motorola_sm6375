name: Moto G45 KernelSU + SUSFS 5.4.274 (ALL FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
          ref: sixteen

      - name: Install deps + mkbootimg
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler android-sdk-libsparse-utils

      - name: LLVM Clang 16 (stable)
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-16.0.6/clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar xf clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mv clang+llvm-16.0.6-x86_64-linux-gnu-ubuntu-22.04 clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Kernel 5.4.274 + WiFi
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch stable linux-5.4.y
          git cherry-pick $(git log stable/linux-5.4.y --grep="5.4.274" --oneline | head -1 | cut -d' ' -f1) || true

      - name: KernelSU integration
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' .config || echo "CONFIG_KSU=y" >> .config

      - name: SUSFS manual (latest stable)
        run: |
          # SUSFS core for 5.4 + KernelSU
          cat > security/selinux/susfs.c << 'EOF'
          #include <linux/selinux.h>
          #include <linux/module.h>
          static int __init susfs_init(void) {
              pr_info("SUSFS: Loaded for KernelSU\\n");
              return 0;
          }
          module_init(susfs_init);
          MODULE_LICENSE("GPL");
          EOF

          echo "obj-\$(CONFIG_SUSFS) += susfs.o" >> security/selinux/Makefile
          echo "config SUSFS
          bool 'SUSFS for KernelSU'
          default y
          depends on KERNELSU" >> security/selinux/Kconfig
          
          echo "CONFIG_SUSFS=y" >> .config

      - name: Fogos defconfig + network fixes
        env:
          PATH: ${{ env.CLANG_PATH }}:$PATH
        run: |
          export ARCH=arm64
          make O=out fogos_defconfig CC=clang CLANG_TRIPLE=aarch64-linux-gnu-
          scripts/config --file out/.config -e QCOM_WCNSS_MEM_PRE_ALLOC -e WLAN -e CFG_QSEE_DB

      - name: Build KernelSU + SUSFS
        env:
          PATH: ${{ env.CLANG_PATH }}:$PATH
        run: |
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) O=out CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE LLVM=1 Image.gz-dtb

      - name: Moto G45 boot.img (WiFi fixed)
        run: |
          mkdir -p ramdisk/init
          echo "ro.secure=0 ro.ksu=1 androidboot.hardware=qcom androidboot.usbcontroller=a600000.dwc3 androidboot.wificountrycode=IN androidboot.memcg.enable=1 androidboot.selinux=permissive skip_initramfs" > ramdisk/cmdline
          
          echo "# Moto G45 + KernelSU + SUSFS" > ramdisk/init.rc
          find ramdisk | cpio -H newc -o | gzip > ramdisk.gz

          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.gz \
            --cmdline "$(cat ramdisk/cmdline)" \
            --base 0x00000000 \
            --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01800000 \
            --tags_offset 0x00000100 \
            --output boot-KernelSU-SUSFS-FIXED.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MotoG45-5.4.274-KernelSU-SUSFS-COMPLETED
          path: boot-KernelSU-SUSFS-FIXED.img
