name: Build Moto G45 Stable Kernel (WiFi/Network Safe)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone kernel + device trees
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: main  # Android 15 / Lineage 22 branch
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git gnupg gperf imagemagick \
        lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
        libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 cpio \
        make python3 python3-pip rsync unzip zip zlib1g-dev device-tree-compiler \
        gcc-aarch64-linux-gnu

    - name: Setup toolchain (Proton Clang 16)
      run: |
        wget https://github.com/kdrag0n/proton-clang/releases/download/16.0.6/proton-clang-16.0.6.tar.gz
        tar xf proton-clang-16.0.6.tar.gz
        echo "TOOLCHAIN=$(pwd)/proton-clang" >> $GITHUB_ENV

    - name: Clone WiFi firmware + vendor blobs
      run: |
        git clone https://github.com/Motorola-SM6375-Devs/proprietary_vendor_motorola_sm6375-common vendor/motorola/sm6375-common
        git clone https://github.com/Motorola-SM6375-Devs/android_device_motorola_fogos device/motorola/fogos

    - name: Update kernel to 5.4.274 + stability patches
      env:
        PATH: ${{ env.TOOLCHAIN }}/bin:${{ env.TOOLCHAIN }}:$PATH
      run: |
        export ARCH=arm64
        # Stable 5.4.274
        git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
        git fetch stable linux-5.4.y
        git cherry-pick $(git log stable/linux-5.4.y --grep="5.4.274" --oneline | head -1 | cut -d' ' -f1) || true
        # WiFi stability (common moto patch)
        git cherry-pick -n 1e53e4f  # SM6375 WiFi fix from LineageOS review

    - name: Configure (fogos_defconfig + vendor modules)
      env:
        PATH: ${{ env.TOOLCHAIN }}/bin:${{ env.TOOLCHAIN }}:$PATH
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out fogos_defconfig CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

    - name: Build kernel + modules (WiFi/Network)
      env:
        PATH: ${{ env.TOOLCHAIN }}/bin:${{ env.TOOLCHAIN }}:$PATH
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 LLVM_IAS=1 Image.gz-dtb modules

        # Install modules to out (for WiFi/firmware)
        make O=out modules_install INSTALL_MOD_PATH=out/modules

    - name: Clone + customize AnyKernel3
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3
        ref: master
        path: AK3

    - name: Package stable ZIP (preserves WiFi/network)
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AK3/
        cp -r out/modules/lib/modules AK3/modules/
        cp -r vendor/motorola/sm6375-common/firmware AK3/firmware/ || true
        
        cd AK3
        # Moto G45 specific
        sed -i 's|anykernel3_device_names=.*|anykernel3_device_names="fogos,cebu45"|g' anykernel.sh
        sed -i 's|#block=.*|block=/dev/block/bootdevice/by-name/boot|g' anykernel.sh
        echo "do.devicecheck=1
        do.modules=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=fogos
        device.name2=cebu45
        is_slot_device=1
        ramdisk_compression=auto" >> anykernel.sh
        
        # WiFi modules auto-load
        echo "modules_load=qcom-wcnss qca_cld3_wlan" >> anykernel.sh

        zip -r ../MotoG45-5.4.274-Stable-$(date +%Y%m%d).zip * -x .git README.md

    - name: Upload safe kernel
      uses: actions/upload-artifact@v4
      with:
        name: MotoG45-fogos-kernel-stable-WiFiSafe
        path: MotoG45-5.4.274-Stable-*.zip
