- name: Configure Fogos (Final Fix)
        run: |
          export ARCH=arm64
          mkdir -p out
          
          # 1. Identify and Merge Configs
          BASE_CONF=$(find arch/arm64/configs/vendor/ -name "holi-qgki_defconfig" -o -name "holi_defconfig" | head -n 1)
          FOGOS_FRAG=$(find arch/arm64/configs/vendor/ -name "moto-holi-fogo.config" -o -name "*fogos*" | head -n 1)
          cat "$BASE_CONF" > arch/arm64/configs/stock_defconfig
          if [ -f "$FOGOS_FRAG" ]; then
            cat "$FOGOS_FRAG" >> arch/arm64/configs/stock_defconfig
          fi

          # 2. Base Configuration
          make O=out ARCH=arm64 stock_defconfig
          
          # 3. Explicitly set options to avoid interactive prompts
          # Fix the Moto DT error
          ./scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY
          # Force LTO to None (saves time and avoids the prompt you saw)
          ./scripts/config --file out/.config -e CONFIG_LTO_NONE
          ./scripts/config --file out/.config -d CONFIG_LTO_CLANG
          # Setup KernelSU & SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
          
          # 4. Wifi/Module Compatibility
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          ./scripts/config --file out/.config -d CONFIG_MODVERSIONS
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
          
          # 5. Finalize without asking questions
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          
          # Building Image and DTBs simultaneously
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            LD=ld.lld \
            Image dtbs
