name: Moto G45 Fogos-ULTIMATE-V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3

    - name: Integrate KernelSU
      run: |
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

    - name: Integrate SUSFS
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
        cp susfs_src/kernel_patches/fs/susfs.c fs/
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
        
        if [ -d "KernelSU" ]; then
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
        fi
        patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

    - name: Configure for Moto G45 Fogos
      run: |
        export ARCH=arm64
        
        # FIX 1: Align Kernel Sublevel (5.4.274)
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
        
        # FIX 2: Exact Version String Match (Wi-Fi Fix)
        sed -i 's/echo "+"/#echo "+"/' scripts/setlocalversion
        echo "-moto-00517-g2ad8f9e38ea6" > localversion
        
        # FIX 3: THE BIG ONE - Remove -Werror from EVERY Makefile in the kernel
        # This fixes the error at line 9929 in your log once and for all.
        find . -name Makefile -o -name Kbuild | xargs sed -i 's/-Werror//g'
        
        # FIX 4: Load fogos config
        make O=out ARCH=arm64 vendor/fogos_defconfig

        # FIX 5: Enable Features & Network
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
        ./scripts/config --file out/.config -e CONFIG_WLAN
        
        # FIX 6: Disable Module Signing (Crucial for Stock)
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_FORCE
        
        # FIX 7: Disable WERROR in .config
        ./scripts/config --file out/.config -d CONFIG_WERROR
        
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # We pass flags to ignore all warnings as errors during the build
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS="-w" Image.gz-dtb || \
        make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc KCFLAGS="-w" Image.gz

    - name: Organize Artifacts
      run: |
        mkdir -p deploy
        find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} deploy/ \;
        find out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtbo" -exec cp {} deploy/ \; || echo "No DTBOs found"

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Fogos-KSU-SUSFS-V3
        path: deploy/*
