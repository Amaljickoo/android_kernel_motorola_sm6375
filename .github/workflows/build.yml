name: Moto G45 Fogos-SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4 patch

    # =========================
    # 🔥 SUKISU ULTRA
    # =========================
    - name: Integrate SukiSU Ultra
      run: |
        set -e
        echo "Cloning SukiSU Ultra..."

        git clone https://github.com/sukisu-ultra/SukiSU-Ultra.git --depth=1 suki

        mkdir -p drivers/kernelsu

        # Copy kernel part
        cp -r suki/kernel/* drivers/kernelsu/

        # Hook build system
        echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        echo 'obj-$(CONFIG_KERNELSU) += kernelsu/' >> drivers/Makefile

        rm -rf suki

        echo "SukiSU Ultra integrated"

    # =========================
    # SUSFS
    # =========================
    - name: Integrate SUSFS
      run: |
        set -e
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs

        cp susfs/kernel_patches/fs/susfs.c fs/ || true
        cp susfs/kernel_patches/include/linux/susfs.h include/linux/ || true
        cp susfs/kernel_patches/include/linux/susfs_def.h include/linux/ || true

        patch -p1 -f < susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

        if [ -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
          (cd drivers/kernelsu && patch -p1 -f < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch) || true
        fi

    # =========================
    # FIXES (CRITICAL)
    # =========================
    - name: Fix SukiSU Ultra + SUSFS (5.4)
      run: |
        set -e

        echo "Applying critical fixes..."

        # fsnotify fix
        find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/\.handle_inode_event/.handle_event/g' {} + || true

        # pgtable fix
        find drivers/kernelsu -type f -name "*.[ch]" -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} + || true

        # remove problematic seccomp
        rm -f drivers/kernelsu/infra/seccomp_cache.c 2>/dev/null || true

        # SELinux relax (Ultra compatibility)
        for f in drivers/kernelsu/selinux/*.c; do
          [ -f "$f" ] && sed -i 's/avc_has_perm/0/g' "$f" || true
        done

        # SUSFS fixes
        grep -q "susfs_def.h" include/linux/fs.h || sed -i '1i #include <linux/susfs_def.h>' include/linux/fs.h
        grep -q "susfs_def.h" fs/namespace.c || sed -i '1i #include <linux/susfs_def.h>' fs/namespace.c

        if ! grep -q "susfs_mnt_id_backup" include/linux/mount.h; then
          sed -i '/struct vfsmount {/a \        int susfs_mnt_id_backup;' include/linux/mount.h
        fi

        echo "All fixes applied"

    # =========================
    # CONFIG
    # =========================
    - name: Configure Kernel
      run: |
        set -e
        export ARCH=arm64

        find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i 's/-Werror/-Wno-error/g' {} +

        make O=out ARCH=arm64 vendor/fogos_defconfig

        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT

        ./scripts/config --file out/.config -e CONFIG_WLAN
        ./scripts/config --file out/.config -e CONFIG_CFG80211
        ./scripts/config --file out/.config -e CONFIG_MAC80211
        ./scripts/config --file out/.config -e CONFIG_INET
        ./scripts/config --file out/.config -e CONFIG_IPV6

        ./scripts/config --file out/.config -d CONFIG_WERROR
        ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG

        make O=out ARCH=arm64 olddefconfig

    # =========================
    # BUILD
    # =========================
    - name: Build Kernel
      run: |
        set -e
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS='-w -Wno-error -Wno-implicit-function-declaration' \
          Image.gz-dtb || \
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS='-w -Wno-error' \
          Image.gz

    # =========================
    # ZIP
    # =========================
    - name: Create Flashable Zip
      run: |
        set -e
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1

        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        else
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz-dtb
        fi

        cd AnyKernel3

        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=fogos/g' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=sm6375/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Fogos SukiSU Ultra/g' anykernel.sh

        zip -r9 ../kernel-sukisu.zip . -x "*.git*"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel-sukisu
        path: kernel-sukisu.zip
