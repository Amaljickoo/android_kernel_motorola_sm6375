name: Build Kernel (Moto G45 + KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu

    - name: Setup Toolchain (Proton Clang)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1

    - name: Integrate KernelSU
      run: |
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

    - name: Create Missing KernelSU Kconfig
      run: |
        mkdir -p drivers/kernelsu/uapi
        cat > drivers/kernelsu/Kconfig << 'KCONFIG_EOF'
        config KERNELSU
        	bool "KernelSU"
        	default n
        	help
        	  KernelSU is a Kernel-based root solution for Android devices.
        	  It provides a system-level root access to Android OS with fine-grained permission control.
        	  If you are unsure about this, say N here.
        
        config KERNELSU_MANAGER
        	bool "KernelSU Manager"
        	depends on KERNELSU
        	default n
        	help
        	  Enable KernelSU Manager support.
        
        config KSU_DEBUG
        	bool "KernelSU Debug"
        	depends on KERNELSU
        	default n
        	help
        	  Enable debug output for KernelSU.
        KCONFIG_EOF

    - name: Create Missing KernelSU Header
      run: |
        mkdir -p drivers/kernelsu/uapi
        cat > drivers/kernelsu/uapi/app_profile.h << 'HEADER_EOF'
        #ifndef _KERNELSU_UAPI_APP_PROFILE_H
        #define _KERNELSU_UAPI_APP_PROFILE_H
        
        #include <linux/types.h>
        
        #define KSU_MAX_PACKAGE_NAME 128
        #define KSU_MAX_GROUPS 32
        #define KSU_SELINUX_DOMAIN 64
        
        struct ksu_capabilities {
            __u32 effective;
            __u32 permitted;
            __u32 inheritable;
        };
        
        struct root_profile {
            __s32 uid;
            __s32 gid;
            __s32 groups_count;
            __s32 groups[KSU_MAX_GROUPS];
            struct ksu_capabilities capabilities;
            char selinux_domain[KSU_SELINUX_DOMAIN];
            __s32 namespaces;
        };
        
        struct non_root_profile {
            __u8 umount_modules;
        };
        
        struct app_profile {
            __u32 version;
            char key[KSU_MAX_PACKAGE_NAME];
            __s32 current_uid;
            __u8 allow_su;
            union {
                struct root_profile rp_config;
                struct non_root_profile nrp_config;
            };
        };
        
        #endif
        HEADER_EOF

    - name: Create Makefile for KernelSU
      run: |
        cat > drivers/kernelsu/Makefile << 'MAKE_EOF'
        obj-$(CONFIG_KERNELSU) += core

