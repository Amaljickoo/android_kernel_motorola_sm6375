name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
        ref: sixteen
        fetch-depth: 1

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4

    - name: Integrate KernelSU
      run: |
        echo "Integrating KernelSU..."
        curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
        if [ ! -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
          echo "ERROR: KernelSU integration failed"
          exit 1
        fi
        echo "KernelSU integrated successfully"

    - name: Integrate SUSFS
      run: |
        echo "Integrating SUSFS..."
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
        
        if [ ! -d "susfs_src" ]; then
          echo "ERROR: Failed to clone SUSFS repository"
          exit 1
        fi
        
        cp susfs_src/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
        cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
        
        if [ -d "KernelSU" ]; then
          if [ -f "susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            cd KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
            cd ..
          fi
        fi
        
        # Apply main patch but ignore failures – we'll manually fix missing parts
        if [ -f "susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch" ]; then
          patch -p1 -f --no-backup-if-mismatch < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
        else
          echo "ERROR: SUSFS main patch not found"
          exit 1
        fi
        
        echo "SUSFS integration completed"

    - name: Fix SUSFS, KernelSU and Missing Kernel 5.4 Definitions
      run: |
        # 1. PGTABLE.H compatibility
        find -L KernelSU drivers/kernelsu -type f -name "*.[ch]" -exec sed -i 's/<linux\/pgtable.h>/<asm\/pgtable.h>/g' {} + || true

        # 2. Create susfs_def.h with all macros AND struct vfsmount extension
        cat > include/linux/susfs_def.h << 'EOF'
        /* SPDX-License-Identifier: GPL-2.0 */
        #ifndef _LINUX_SUSFS_DEF_H
        #define _LINUX_SUSFS_DEF_H
        
        #include <linux/idr.h>
        
        /* SUSFS path length */
        #ifndef SUSFS_MAX_LEN_PATHNAME
        #define SUSFS_MAX_LEN_PATHNAME 256
        #endif
        
        /* Task structure flags */
        #ifndef TASK_STRUCT_NON_ROOT_USER_APP_PROC
        #define TASK_STRUCT_NON_ROOT_USER_APP_PROC (1UL << 0)
        #endif
        
        /* Inode state flags */
        #ifndef INODE_STATE_SUS_KSTAT
        #define INODE_STATE_SUS_KSTAT (1UL << 29)
        #endif
        #ifndef INODE_STATE_SUS_PATH
        #define INODE_STATE_SUS_PATH (1UL << 30)
        #endif
        #ifndef INODE_STATE_OPEN_REDIRECT
        #define INODE_STATE_OPEN_REDIRECT (1UL << 31)
        #endif
        
        /* SUSFS magic number */
        #ifndef SUSFS_MAGIC
        #define SUSFS_MAGIC 0x53465346
        #endif
        
        /* Mount ID constants */
        #ifndef DEFAULT_SUS_MNT_ID
        #define DEFAULT_SUS_MNT_ID 10000
        #endif
        #ifndef DEFAULT_SUS_MNT_GROUP_ID
        #define DEFAULT_SUS_MNT_GROUP_ID 10000
        #endif
        #ifndef DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE
        #define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 9999
        #endif
        
        /* Clone flags */
        #ifndef CL_COPY_MNT_NS
        #define CL_COPY_MNT_NS 0x00001000
        #endif
        #ifndef CL_ZYGOTE_COPY_MNT_NS
        #define CL_ZYGOTE_COPY_MNT_NS 0x00002000
        #endif
        
        /* SUSFS auto-mount feature toggles (disable) */
        #ifndef susfs_is_auto_add_sus_bind_mount_enabled
        #define susfs_is_auto_add_sus_bind_mount_enabled 0
        #endif
        #ifndef susfs_is_auto_add_try_umount_for_bind_mount_enabled
        #define susfs_is_auto_add_try_umount_for_bind_mount_enabled 0
        #endif
        #ifndef susfs_is_auto_add_sus_ksu_default_mount_enabled
        #define susfs_is_auto_add_sus_ksu_default_mount_enabled 0
        #endif
        
        /* Declare IDA structures */
        extern struct ida susfs_mnt_id_ida;
        extern struct ida susfs_mnt_group_ida;
        
        /* Declare functions */
        extern bool is_current_zygote_domain(void);
        extern bool susfs_is_current_ksu_domain(void);
        
        #endif /* _LINUX_SUSFS_DEF_H */
        EOF
        
        # 3. MANUALLY add susfs_mnt_id_backup to struct vfsmount in mount.h
        #    Because the SUSFS patch fails to apply this hunk.
        if grep -q "susfs_mnt_id_backup" include/linux/mount.h; then
          echo "Field already exists in mount.h"
        else
          sed -i '/struct vfsmount {/a \ \tint susfs_mnt_id_backup;' include/linux/mount.h
          echo "Added susfs_mnt_id_backup to struct vfsmount"
        fi
        
        # 4. Inject header into fs.h and fs/namespace.c
        echo '#include <linux/susfs_def.h>' >> include/linux/fs.h
        sed -i '1i #include <linux/susfs_def.h>' fs/namespace.c || true
        
        # 5. Define IDA structures at the end of fs/namespace.c
        cat >> fs/namespace.c << 'EOF'
        /* SUSFS IDA definitions */
        DEFINE_IDA(susfs_mnt_id_ida);
        DEFINE_IDA(susfs_mnt_group_ida);
        EXPORT_SYMBOL(susfs_mnt_id_ida);
        EXPORT_SYMBOL(susfs_mnt_group_ida);
        EOF
        
        # 6. Fix pkg_observer.c: handle_inode_event -> handle_event
        for pkg_file in "KernelSU/manager/pkg_observer.c" "drivers/kernelsu/manager/pkg_observer.c"; do
          if [ -f "$pkg_file" ]; then
            sed -i 's/\.handle_inode_event/.handle_event/g' "$pkg_file"
          fi
        done
        
        # 7. Fix allowlist.c: define TWA_RESUME if not defined
        for allow_file in "KernelSU/policy/allowlist.c" "drivers/kernelsu/policy/allowlist.c"; do
          if [ -f "$allow_file" ]; then
            # Add definition at the top of the file
            sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME 0\n#endif' "$allow_file"
          fi
        done
        
        # 8. Re-fix seccomp_cache.c (ensure it's the patched version)
        for seccomp_file in "KernelSU/infra/seccomp_cache.c" "drivers/kernelsu/infra/seccomp_cache.c"; do
          if [ -f "$seccomp_file" ]; then
            cat > "$seccomp_file" << 'EOF2'
        // SPDX-License-Identifier: GPL-2.0
        #include <linux/seccomp.h>
        #include <linux/bitmap.h>
        #include "seccomp_cache.h"
        
        #ifndef SECCOMP_ARCH_NATIVE_NR
        #define SECCOMP_ARCH_NATIVE_NR 512
        #endif
        
        static DECLARE_BITMAP(allow_native, SECCOMP_ARCH_NATIVE_NR);
        static DEFINE_SPINLOCK(seccomp_cache_lock);
        
        void seccomp_cache_add_native(uint32_t syscall)
        {
            if (syscall < SECCOMP_ARCH_NATIVE_NR) {
                spin_lock(&seccomp_cache_lock);
                set_bit(syscall, allow_native);
                spin_unlock(&seccomp_cache_lock);
            }
        }
        
        bool seccomp_cache_check_native(uint32_t syscall)
        {
            bool allowed = false;
            if (syscall < SECCOMP_ARCH_NATIVE_NR) {
                spin_lock(&seccomp_cache_lock);
                allowed = test_bit(syscall, allow_native);
                spin_unlock(&seccomp_cache_lock);
            }
            return allowed;
        }
        
        void seccomp_cache_clear(void)
        {
            spin_lock(&seccomp_cache_lock);
            bitmap_zero(allow_native, SECCOMP_ARCH_NATIVE_NR);
            spin_unlock(&seccomp_cache_lock);
        }
        EOF2
          fi
        done
        
        echo "All SUSFS and KernelSU compatibility fixes applied."

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        
        # Prevent WiFi/network breakage
        sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 274/' Makefile
        touch .scmversion
        sed -i 's/echo "+"/#echo "+"/' scripts/setlocalversion
        sed -i 's/-dirty//g' scripts/setlocalversion
        echo "-moto-00517-g2ad8f9e38ea6" > localversion
        
        # Disable -Werror globally
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b/-Wno-error/g' {} \;
        
        # Load base config
        make O=out ARCH=arm64 vendor/fogos_defconfig
        
        # Enable KernelSU and SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
        ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
        
        # Enable Moto G45 support
        ./scripts/config --file out/.config -e CONFIG_MACH_SM6375
        ./scripts/config --file out/.config -e CONFIG_ARCH_MOTO
        
        # Enable WiFi
        ./scripts/config --file out/.config -e CONFIG_WLAN
        ./scripts/config --file out/.config -e CONFIG_WLAN_VENDOR_QCOM
        ./scripts/config --file out/.config -e CONFIG_CFG80211
        ./scripts/config --file out/.config -m CONFIG_WCNSS_CORE
        ./scripts/config --file out/.config -m CONFIG_WCNSS_CORE_PRONTO
        ./scripts/config --file out/.config -e CONFIG_CNSS2
        
        # Disable problematic features
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
        ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_FORCE
        ./scripts/config --file out/.config -d CONFIG_WERROR
        ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO
        ./scripts/config --file out/.config -d CONFIG_DEBUG_INFO_REDUCED
        
        # Finalize
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make -j$(nproc) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CC=aarch64-linux-gnu-gcc \
          HOSTCC=gcc \
          KCFLAGS="-Wno-error -w -Wno-unused-variable -Wno-unused-function" \
          Image.gz-dtb || \
        make -j$(nproc) O=out ARCH=arm64 \
          CC=aarch64-linux-gnu-gcc \
          KCFLAGS="-Wno-error -w -Wno-unused-variable -Wno-unused-function" \
          Image.gz

    - name: Create AnyKernel3 Zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz-dtb
        else
          echo "ERROR: No kernel image found"
          exit 1
        fi
        
        cd AnyKernel3
        
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/do.modules=1/do.modules=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=fogo/g' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=fogos/g' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=sm6375/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Moto G45 Kernel - KernelSU + SUSFS/g' anykernel.sh
        sed -i 's/supported.versions=.*/supported.versions=14-15/g' anykernel.sh
        
        chmod 755 anykernel.sh
        zip -r9 ../Moto-G45-Kernel.zip ./* -x "*.git*"
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Moto-G45-Kernel
        path: Moto-G45-Kernel.zip
