name: Build Moto G45 (fogos) Stock-ROM Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2 # Most stable branch for G45/SM6375-AC
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git kmod libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole llvm lld

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 tools/clang

      - name: Integrate KernelSU & SUSFS
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

      - name: Configure Fogos Fragments
        run: |
          export ARCH=arm64
          mkdir -p out
          
          # Step 1: Find the Base Config (Holi)
          BASE_CONF=$(find arch/arm64/configs/vendor/ -name "holi-qgki_defconfig" -o -name "holi_defconfig" | head -n 1)
          
          # Step 2: Find the Fogos Fragment
          FOGOS_FRAG=$(find arch/arm64/configs/vendor/ -name "moto-holi-fogo.config" -o -name "*fogos*" | head -n 1)
          
          echo "Using Base: $BASE_CONF"
          echo "Using Fragment: $FOGOS_FRAG"

          # Step 3: Merge them into one 'stock_defconfig'
          cat "$BASE_CONF" > arch/arm64/configs/stock_defconfig
          if [ -f "$FOGOS_FRAG" ]; then
            cat "$FOGOS_FRAG" >> arch/arm64/configs/stock_defconfig
          fi

          make O=out ARCH=arm64 stock_defconfig
          
          # WIFI FIX: Match Stock Sublevel
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          
          # KSU & SUSFS Setup
          ./scripts/config --file out/.config -e CONFIG_KERNELSU
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS
          ./scripts/config --file out/.config -e CONFIG_KERNELSU_SUSFS_HAS_MAGIC_MOUNT
          
          # STOCK COMPATIBILITY: Disable module signing for Stock Wi-Fi
          ./scripts/config --file out/.config -d CONFIG_MODVERSIONS
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG
          ./scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
          
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          CLANG_BIN=$PWD/tools/clang/bin
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCC=gcc \
            LD=ld.lld

      - name: Upload Stock Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-G45-Fogos-Stock
          path: out/arch/arm64/boot/Image
