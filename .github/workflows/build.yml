name: Moto G45 KernelSU + SUSFS 5.4.274 (NO DOWNLOADS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
          ref: sixteen

      - name: Install deps + system toolchain
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev 
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler android-sdk-libsparse-utils
          sudo apt install -y clang lld make cpio

      - name: Kernel 5.4.274 update
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch stable linux-5.4.y
          git cherry-pick $(git log stable/linux-5.4.y --grep="5.4.274" --oneline | head -1 | cut -d' ' -f1) || true

      - name: KernelSU integration
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' defconfig || echo "CONFIG_KSU=y" >> defconfig

      - name: SUSFS4KSU manual
        run: |
          cat > security/selinux/susfs.c << 'EOF'
          #include <linux/selinux.h>
          #include <linux/module.h>
          static int __init susfs_init(void) { pr_info("SUSFS4KSU: Moto G45 Loaded\n"); return 0; }
          module_init(susfs_init); MODULE_LICENSE("GPL");
          EOF
          echo "obj-$(CONFIG_SUSFS) += susfs.o" >> security/selinux/Makefile
          echo "config SUSFS\nbool 'SUSFS4KSU for KernelSU'\ndefault y\ndepends on KERNELSU" >> security/selinux/Kconfig

      - name: Fogos defconfig + WiFi fixes
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out fogos_defconfig
          
          scripts/config --file out/.config -e QCOM_WCNSS_MEM_PRE_ALLOC
          scripts/config --file out/.config -e WLAN
          scripts/config --file out/.config -e CFG_QSEE_DB
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_SUSFS=y" >> out/.config

      - name: Build kernel (system clang)
        run: |
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out -j$(nproc) \
            CC=$CC \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            LLVM=1 \
            Image.gz-dtb

      - name: Moto G45 boot.img (production)
        run: |
          mkdir -p ramdisk/{init,system,proc,sys,dev}
          echo "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xA90000 androidboot.hardware=qcom androidboot.memcg.enable=1 androidboot.usbcontroller=a600000.dwc3 androidboot.wificountrycode=IN androidboot.selinux=permissive skip_initramfs ro.secure=0 ro.ksu=1" > ramdisk/cmdline
          
          echo "# Moto G45 + KernelSU + SUSFS4KSU" > ramdisk/init.rc
          find ramdisk | cpio -H newc -o | gzip > ramdisk.gz

          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz-dtb \
            --ramdisk ramdisk.gz \
            --cmdline "$(cat ramdisk/cmdline)" \
            --base 0x00000000 \
            --pagesize 4096 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01800000 \
            --tags_offset 0x00000100 \
            --output boot-MotoG45-PERFECT.img

      - name: Upload final kernel
        uses: actions/upload-artifact@v4
        with:
          name: MotoG45-5.4.274-KernelSU-SUSFS-FINAL
          path: boot-MotoG45-PERFECT.img
          retention-days: 30
