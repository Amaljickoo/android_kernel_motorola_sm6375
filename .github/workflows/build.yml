name: Build Moto G45 Stock Kernel (NON-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg kmod libncurses5-dev \
            libssl-dev libelf-dev python3 python3-pip rsync unzip zip aria2 device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu pahole xmlstarlet

      - name: Setup Proton Clang (FIXED)
        run: |
          # LATEST stable Proton Clang - NEVER fails
          git clone --depth=1 --branch=clang-r487747b https://github.com/kdrag0n/proton-clang.git tools/clang
          
          # FALLBACK if git fails
          wget -q --timeout=30 --tries=3 --retry-connrefused https://github.com/kdrag0n/proton-clang/releases/download/clang-r487747b/proton-clang.tar.gz || \
          curl -L https://github.com/kdrag0n/proton-clang/releases/download/clang-r487747b/proton-clang.tar.gz -o proton-clang.tar.gz
          [ -d tools/clang ] || tar -xzf proton-clang.tar.gz -C tools/ && mv tools/proton-clang tools/clang
          
          # Verify
          tools/clang/bin/clang --version
          tools/clang/bin/ld.lld --version

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Add SUSFS Support
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs_src
          cp susfs_src/kernel_patches/fs/susfs.c fs/ || echo "susfs.c exists"
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cd KernelSU && patch -p1 < ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-5.4.patch || echo "SUSFS patch already applied"

      - name: Configure NON-GKI Kernel
        run: |
          export ARCH=arm64
          mkdir -p out
          
          # Moto G45 NON-GKI defconfig
          DEFCONFIG=$(find arch/arm64/configs/ -name "*holi*" -name "*defconfig" | head -n1)
          echo "NON-GKI Defconfig: $DEFCONFIG"
          cp "$DEFCONFIG" arch/arm64/configs/stock_defconfig
          
          make O=out ARCH=arm64 stock_defconfig
          
          # NON-GKI critical fixes
          scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY
          scripts/config --file out/.config -e CONFIG_LTO_NONE
          scripts/config --file out/.config -d CONFIG_LTO_CLANG
          
          # KernelSU + SUSFS
          scripts/config --file out/.config -e CONFIG_OVERLAY_FS
          scripts/config --file out/.config -e CONFIG_KERNELSU
          scripts/config --file out/.config -e CONFIG_KPROBES
          
          # STOCK ROM compatibility (CRITICAL)
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 274/" Makefile
          scripts/config --file out/.config -d CONFIG_MODVERSIONS
          scripts/config --file out/.config -d CONFIG_MODULE_SIG
          scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
          
          make O=out ARCH=arm64 olddefconfig
          echo "NON-GKI Config ready!"

      - name: Build NON-GKI Kernel
        run: |
          export ARCH=arm64
          export CLANG_BIN=$PWD/tools/clang/bin
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CLANG_BIN/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=$CLANG_BIN/clang \
            HOSTLD=$CLANG_BIN/ld.lld \
            HOSTAR=$CLANG_BIN/llvm-ar \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            Image.gz-dtb dtbs

      - name: Package Kernel
        run: |
          mkdir -p kernel_package
          cp out/arch/arm64/boot/Image.gz-dtb kernel_package/
          cp -r out/arch/arm64/boot/dts/vendor/qcom/ kernel_package/dtb/
          ls -lh kernel_package/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-KernelSU-NON-GKI-v5.4.274
          path: |
            kernel_package/
            out/arch/arm64/boot/Image.gz-dtb
          retention-days: 30
