name: Moto G45 KernelSU - FIXED HEADERS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-22.2

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libncurses5-dev \
            libssl-dev libelf-dev python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            pahole clang lld llvm device-tree-compiler

      - name: Manual KernelSU (FIX HEADERS)
        run: |
          # Download KernelSU manually
          git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
          cd KernelSU/kernel
          make -j$(nproc)
          make modules_install INSTALL_MOD_PATH=../modules
          cd ../..
          
          # Copy kernel modules
          mkdir -p out/modules
          cp KernelSU/kernel/ksu.ko out/modules/
          
          # Create uapi headers
          mkdir -p include/uapi/linux
          echo '#define KSU_VERSION "v0.9.3"' > include/uapi/linux/app_profile.h
          echo '#define KSU_NEW_DCACHE_FLUSH 0' >> include/uapi/linux/app_profile.h

      - name: Configure
        run:
