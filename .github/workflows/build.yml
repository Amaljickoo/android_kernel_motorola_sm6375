name: Moto G45 Fogos-ULTIMATE-V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Motorola-SM6375-Devs/android_kernel_motorola_sm6375
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler make cpio python3 lz4 patch

      - name: Add KernelSU
        run: |
          set -e
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main || true

          if [ ! -d KernelSU ] && [ ! -d drivers/kernelsu ]; then
            echo "KernelSU failed"
            exit 1
          fi

      - name: Add SUSFS
        run: |
          set -e
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 --depth=1 susfs

          if [ ! -d susfs ]; then
            echo "SUSFS clone failed"
            exit 1
          fi

          cp susfs/kernel_patches/fs/susfs.c fs/ || true
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/ || true

          if [ -f susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch ]; then
            patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
          fi

      - name: Fix Basic Issues
        run: |
          set -e

          # pgtable fix
          find KernelSU drivers/kernelsu -type f -name "*.c" -exec sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' {} + || true

          # create header
          mkdir -p include/linux
          echo "#define SUSFS_MAGIC 0x53465346" > include/linux/susfs_def.h

          # include header
          echo '#include <linux/susfs_def.h>' >> include/linux/fs.h

      - name: Configure Kernel
        run: |
          set -e
          export ARCH=arm64

          make O=out ARCH=arm64 vendor/fogos_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_KERNELSU \
            -e CONFIG_KERNELSU_SUSFS \
            -e CONFIG_CFG80211 \
            -e CONFIG_WLAN \
            -e CONFIG_WLAN_VENDOR_QCOM \
            -e CONFIG_CNSS2 || true

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc) O=out \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb || \
          make -j$(nproc) O=out \
            CC=aarch64-linux-gnu-gcc \
            KCFLAGS="-Wno-error" \
            Image.gz

      - name: Pack Kernel
        run: |
          set -e

          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz-dtb
          fi

          cd AnyKernel3
          zip -r9 ../Moto-G45-Kernel.zip . -x "*.git*"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-Kernel
          path: Moto-G45-Kernel.zip
